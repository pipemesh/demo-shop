# The backend's workflow: runs when backend files change, builds, deploys.
name: deploy backend
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: backend/test.sh
      - run: backend/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: backend/dist/api.tar
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: backend/dist
      - run: deploy/publish.sh api backend/dist/api.tar
        env:
          PAGES_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          CI_COMMIT_SHORT_SHA: ${{ github.sha }}
