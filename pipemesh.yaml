# demo-shop: one pipeline for a shop whose backend (a price API) and
# frontend (the site that calls it) live in one repository. The backend is
# published as static JSON and the site as static files, both to this
# repository's GitHub Pages, so the shop is real: https://pipemesh.github.io/demo-shop/
builds:
  type: workflow
  stages:
    - build
  jobs:
    build_backend:
      job_type: build
      stage: build
      image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
      checkout:
        - backend
        - tools
      script: |
        backend/test.sh
        backend/build.sh
      produces:
        api: backend/dist/api.tar
      reports:
        tests: backend/build/reports/tests
        coverage: backend/build/reports/coverage.md

    build_frontend:
      job_type: build
      stage: build
      image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
      checkout:
        - frontend
        - tools
      script: |
        frontend/test.sh
        frontend/build.sh
      produces:
        site: frontend/dist/site.tar
      reports:
        tests: frontend/build/reports/tests
        preview: frontend/dist/site
        screenshot: frontend/dist/preview.svg

pipeline:
  type: pipeline
  stages:
    - build
    - deploy
    - smoke

  jobs:
    # The builds run as one workflow job: a group of builds and tests that
    # deploy nothing, waited for as one. It is the same body the pull
    # request checks run (pipemesh.workflows.checks below).
    build:
      job_type: workflow
      stage: build
      body: !ref builds

    # A deploy checks out only the deploy scripts and consumes one
    # artifact. It runs when that artifact, or a script, is new to it, and
    # it is done once the site serves what it pushed.
    deploy_backend:
      job_type: deploy
      production: true
      stage: deploy
      image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
      checkout:
        - deploy
      consumes:
        API: build/build_backend/api
      variables:
        PAGES_REMOTE: git@github.com:pipemesh/demo-shop.git
        SITE_URL: !settings
      secrets:
        - PAGES_DEPLOY_KEY
      script: |
        deploy/ssh.sh
        deploy/publish.sh api "$API"

    # The site ships after the API it calls: needs: orders the two deploys
    # without an artifact between them.
    deploy_frontend:
      job_type: deploy
      production: true
      stage: deploy
      image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
      needs:
        - deploy_backend
      checkout:
        - deploy
      consumes:
        SITE: build/build_frontend/site
      variables:
        PAGES_REMOTE: git@github.com:pipemesh/demo-shop.git
        SITE_URL: !settings
      secrets:
        - PAGES_DEPLOY_KEY
      script: |
        deploy/ssh.sh
        deploy/publish.sh site "$SITE"

    # A task runs on every revision that reaches it: the live shop is
    # asked whether the page loads and the API it calls answers.
    smoke:
      job_type: task
      stage: smoke
      image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
      needs:
        - deploy_backend
        - deploy_frontend
      checkout:
        - smoke
      variables:
        SITE_URL: !settings
      script: node smoke/check.mjs "$SITE_URL"

pipemesh:
  pipelines:
    pipeline: !ref pipeline
  workflows:
    # The same builds, per pull request.
    checks:
      body: !ref builds
      on: pull_request
    # Every night, ask the live shop whether it still answers.
    nightly:
      body: !include .pipemesh/nightly.yaml
      on: schedule
      cron: "0 3 * * *"
