# Nightly: asks the live shop whether it still answers. A workflow of
# tasks, independent of pushes.
type: workflow
stages:
  - check
jobs:
  live:
    job_type: task
    stage: check
    image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
    checkout:
      - smoke
    variables:
      SITE_URL: !settings
    script: node smoke/check.mjs "$SITE_URL"
